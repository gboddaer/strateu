name: Broad Python regression tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: broad-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  broad:
    name: ${{ matrix.suite }} / ${{ matrix.os }} / Python 3.11
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        suite: [terminal, setup]
    env:
      STRATA_GGUF_PY: ${{ github.workspace }}/.test-deps/llama.cpp/gguf-py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Fetch the same gguf-py setup installs (no engine or model download)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ggml-org/llama.cpp
          ref: 3cf03257f219afbe7334045ff7c6a06ac68c627d
          path: .test-deps/llama.cpp
          sparse-checkout: gguf-py
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Install pinned test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Terminal and Control regression tests
        if: matrix.suite == 'terminal'
        run: python -m pytest tests/terminal -q --tb=short --junitxml=terminal-results.xml
      - name: Setup and MCP regression tests
        if: matrix.suite == 'setup'
        shell: bash
        run: python -m pytest tools/test_setup_*.py tools/test_strata_mcp.py -q --tb=short --junitxml=setup-results.xml
      - name: Retain test results even when a suite fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: broad-${{ matrix.suite }}-${{ matrix.os }}
          path: '*-results.xml'
          if-no-files-found: warn
          retention-days: 7

  desktop:
    name: Desktop / ${{ matrix.os }} / Rust 1.90
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install Linux desktop build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install the declared Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Install locked host dependencies
        run: npm --prefix apps/host ci
      - name: Test the host
        run: npm --prefix apps/host test
      - name: Typecheck and build the frontend
        run: |
          npm --prefix apps/host run typecheck
          npm --prefix apps/host run build
      - name: Check the desktop with the fixed updater dependency
        shell: bash
        run: |
          # Compile only: real Control/Node/Harness/engine resources are staged for release packaging separately.
          mkdir -p apps/desktop/src-tauri/resources/harness
          cargo +1.90.0 check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
